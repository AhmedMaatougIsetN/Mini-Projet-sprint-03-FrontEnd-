<div class="container">
  <h2>Ajouter un laptop :</h2>
  @if (message) { <div class="alert alert-danger">{{message}}</div> }
  <form (ngSubmit)="addlaptop()">
    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label for="nomlaptop">Nom laptop</label>
      <input id="nomlaptop" type="text" [(ngModel)]="newlaptop.nomlaptop" name="nomlaptop" class="form-control" required>
    </div>
    <div class="col-sm-2 col-md-2 col-lg-2 mb-3">
      <label for="prixlaptop">Prix laptop</label>
      <input id="prixlaptop" type="number" [(ngModel)]="newlaptop.prixlaptop" name="prixlaptop" class="form-control" required>
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label for="dateCreation">Date création</label>
      <input id="dateCreation" type="date" [(ngModel)]="newlaptop.dateCreation" name="dateCreation" class="form-control" required>
    </div>
    <div class="col-sm-4 col-md-4 col-lg-4 mb-3">
      <label for="idType">Type</label>
      <select id="idType" name="idType" [(ngModel)]="newIdType" class="form-control form-control-lg" required>
        <option [ngValue]="null">Choisir un type</option>
        @for (type of types; track type.idType) { <option [ngValue]="type.idType">{{type.nomType}}</option> }
      </select>
    </div>
    <button type="submit" class="btn btn-success">Ajouter</button>
  </form>
</div>
